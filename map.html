<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>5K Map</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="top">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
      <circle cx="15" cy="15" r="13" stroke="#e8b85c" stroke-width="1.4"/>
      <path d="M15 4 L15 26 M4 15 L26 15" stroke="#263049" stroke-width="1"/>
      <path d="M15 8 L18 15 L15 22 L12 15 Z" fill="#e8b85c"/>
    </svg>
    <h1>5K Map</h1>
  </div>

  <div class="stats-row">
    <div class="stat">
      <span class="label">Countries 5K'd</span>
      <span class="value" id="stat-countries">–</span>
    </div>
    <div class="stat">
      <span class="label">Total 5Ks</span>
      <span class="value" id="stat-total">–</span>
    </div>
    <div class="stat">
      <span class="label">Most 5K'd</span>
      <span class="value" id="stat-top">–</span>
    </div>
    <div class="stat">
      <span class="label">Coverage</span>
      <span class="value" id="stat-progress">–</span>
    </div>
  </div>

  <div class="team-dropdown" id="team-dropdown">
    <button class="team-dropdown-toggle" id="team-dropdown-toggle" type="button" aria-haspopup="true" aria-expanded="false">
      <span id="team-dropdown-label">Team</span>
      <svg class="chevron" width="10" height="6" viewBox="0 0 10 6" fill="none">
        <path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <ul class="team-dropdown-menu" id="team-dropdown-menu"></ul>
  </div>
</header>

<main>
  <div class="app-body">
    <aside id="sidebar">
      <div class="sidebar-section search-wrap">
        <input id="search-box" type="text" placeholder="Search countries…" autocomplete="off" />
        <ul id="search-results"></ul>
      </div>

      <div class="sidebar-section leaderboard-wrap">
        <div class="sidebar-title-row">
          <span class="sidebar-title">Leaderboard</span>
          <div class="sort-toggle">
            <button id="sort-count" class="active" type="button" title="Sort by count">#</button>
            <button id="sort-alpha" type="button" title="Sort A–Z">A–Z</button>
          </div>
        </div>
        <ul id="leaderboard"></ul>
        <button id="copy-summary" type="button">Copy summary</button>
      </div>

      <div id="country-detail" class="sidebar-section hidden"></div>
    </aside>

    <div class="map-pane">
      <svg id="map"></svg>

      <div id="legend">
        <div class="legend-title">Times 5K'd</div>
        <div class="rainbow-legend">
          <div class="rainbow-item"><span class="rainbow-swatch" data-n="1"></span>1</div>
          <div class="rainbow-item"><span class="rainbow-swatch" data-n="2"></span>2</div>
          <div class="rainbow-item"><span class="rainbow-swatch" data-n="3"></span>3</div>
          <div class="rainbow-item"><span class="rainbow-swatch" data-n="4"></span>4</div>
          <div class="rainbow-item"><span class="rainbow-swatch" data-n="5"></span>5</div>
          <div class="rainbow-item"><span class="rainbow-swatch" data-n="6"></span>6</div>
          <div class="rainbow-item"><span class="rainbow-swatch" data-n="7"></span>7+</div>
        </div>
        <div class="unvisited-row static">
          <span class="swatch no-coverage-swatch"></span>
          <span>No official coverage</span>
        </div>
        <button id="unvisited-toggle" class="unvisited-row" type="button">
          <span>Not yet 5K'd</span>
        </button>
        <button id="dots-toggle" class="unvisited-row" type="button">
          <span>Show 5K pins</span>
        </button>
      </div>

      <div id="zoom-controls">
        <button id="zoom-in" title="Zoom in">+</button>
        <button id="zoom-out" title="Zoom out">−</button>
        <button id="zoom-reset" title="Reset view">⤾</button>
      </div>

      <div id="status"></div>
    </div>
  </div>
</main>

<div id="tooltip"></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5/papaparse.min.js"></script>
<script src="js/teams-config.js"></script>
<script src="js/map.js"></script>
</body>
</html>
